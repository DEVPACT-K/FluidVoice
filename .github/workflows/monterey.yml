name: monterey-compat
on: [push, pull_request]
jobs:
  monterey:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Verify deployment 12.7
        run: |
          ! grep -q 'MACOSX_DEPLOYMENT_TARGET = 15' Fluid.xcodeproj/project.pbxproj || (echo "Deployment regressed to 15" && exit 1)
          grep -q 'MACOSX_DEPLOYMENT_TARGET = 12.7' Fluid.xcodeproj/project.pbxproj
          grep -q '12.7' Package.swift
          ! grep -q 'MARKETING_VERSION = 1.5.1' Fluid.xcodeproj/project.pbxproj || (echo "Marketing version regressed to 1.5.1" && exit 1)
          grep -q 'MARKETING_VERSION = 1.6.10' Fluid.xcodeproj/project.pbxproj
          ! grep -q 'B/cohere-coreml-asr' Fluid.xcodeproj/project.pbxproj || (echo "FluidAudio branch regressed" && exit 1)
          grep -q 'MACOSX_DEPLOYMENT_TARGET' build.sh || (echo "build.sh should log deployment" && exit 1)
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Fluid.xcodeproj -scheme Fluid -derivedDataPath DerivedData
      - name: Patch deps for Monterey 12.7
        run: |
          ./scripts/patch-deps-for-monterey.sh
          # Force SwiftPM to discard its cached build plan and re-read patched manifests
          find DerivedData/SourcePackages/checkouts -name Package.swift -exec touch {} +
          rm -f DerivedData/SourcePackages/workspace-state.json
          rm -rf DerivedData/SourcePackages/Manifests
          echo "--- FluidAudio manifest after patch ---"
          sed -n '1,12p' DerivedData/SourcePackages/checkouts/FluidAudio/Package.swift
      - name: Build unsigned x86_64 (Monterey Intel)
        run: >
          xcodebuild -project Fluid.xcodeproj -scheme Fluid -configuration Debug
          -destination 'platform=macOS' -derivedDataPath DerivedData
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidVoice-Debug-Monterey-${{ github.run_number }}
          path: DerivedData/Build/Products/Debug/*.app
          retention-days: 14
          if-no-files-found: error
      - name: Run Monterey tests (non-blocking)
        continue-on-error: true
        run: set -o pipefail && xcodebuild test -project Fluid.xcodeproj -scheme Fluid -destination 'platform=macOS' -derivedDataPath DerivedData -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -only-testing:FluidDictationIntegrationTests/MontereyOverlayTests -only-testing:FluidDictationIntegrationTests/MontereyCompatTests -only-testing:FluidDictationIntegrationTests/MontereyDefaultModelTests 2>&1 | tail -40
